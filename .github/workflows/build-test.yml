name: Build and Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  run-tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-22.04
        buildsystem:
          - meson
          - cmake
          - waf
        compiler:
          - CC: gcc-10
            CXX: g++-10
          - CC: gcc-11
            CXX: g++-11
          - CC: gcc-12
            CXX: g++-12
          - CC: gcc-13
            CXX: g++-13
          - CC: gcc-14
            CXX: g++-14
          - CC: clang
            CXX: clang++
        csp_version:
          - 1
          - 2
        exclude:
          # Ubuntu 22.04 only has GCC 10, 11, 12
          - os: ubuntu-22.04
            compiler:
              CC: gcc-13
          - os: ubuntu-22.04
            compiler:
              CC: gcc-14
          # Ubuntu 24.04 only has GCC 12, 13, 14
          - os: ubuntu-24.04
            compiler:
              CC: gcc-10
          - os: ubuntu-24.04
            compiler:
              CC: gcc-11

    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup packages on Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install libzmq3-dev libsocketcan-dev socat iproute2
          sudo apt-get install linux-modules-extra-$(uname -r)
          sudo apt install patchelf

      - name: Setup build system packages on Linux
        if: ${{ runner.os == 'Linux' && matrix.buildsystem != 'waf' }}
        run: |
          sudo apt-get install ninja-build ${{ matrix.buildsystem }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        env:
          CC: ${{ matrix.compiler.CC }}
          CXX: ${{ matrix.compiler.CXX }}
        run: python3 ./examples/buildall.py --build-system=${{ matrix.buildsystem }}

      - name: Compare RPATH of executables
        run: |
          echo "==> csp_server"
          readelf -d ./build/examples/csp_server | grep -E 'RPATH|RUNPATH' || echo "No RPATH"
          echo "==> csp_client"
          readelf -d ./build/examples/csp_client | grep -E 'RPATH|RUNPATH' || echo "No RPATH"
          echo "==> Other examples"
          find ./build/examples -type f -executable | while read exe; do
            echo "--- $exe ---"
            readelf -d "$exe" | grep -E 'RPATH|RUNPATH' || echo "No RPATH"
          done

      - name: Run Loopback Test
        run: |
          ./build/examples/csp_arch
          ./build/examples/csp_server_client -T 10

      - name: Run KISS Client Test
        run: |
          socat -d -d -d pty,raw,echo=0,link=/tmp/pty1 pty,raw,echo=0,link=/tmp/pty2 &
          sleep 1
          ./build/examples/csp_server -k /tmp/pty1 -a 1 -T 10 -v ${{ matrix.csp_version }} &
          ./build/examples/csp_client -k /tmp/pty2 -a 2 -C 1 -t -v ${{ matrix.csp_version }}
          pkill socat

      - name: Run KISS Server Test
        run: |
          socat -d -d -d pty,raw,echo=0,link=/tmp/pty1 pty,raw,echo=0,link=/tmp/pty2 &
          sleep 1
          ./build/examples/csp_client -k /tmp/pty2 -a 2 -C 1 -T 10 -v ${{ matrix.csp_version }} &
          ./build/examples/csp_server -k /tmp/pty1 -a 1 -t -v ${{ matrix.csp_version }}
          pkill socat

      - name: Run ZMQ Client Test
        run: |
          ./build/examples/zmqproxy &
          ./build/examples/csp_server -z localhost -a 1 -T 10 -v ${{ matrix.csp_version }} &
          ./build/examples/csp_client -z localhost -a 2 -C 1 -t -v ${{ matrix.csp_version }}
          pkill zmqproxy

      - name: Run ZMQ Server Test
        run: |
          ./build/examples/zmqproxy &
          ./build/examples/csp_client -z localhost -a 2 -C 1 -T 10 -v ${{ matrix.csp_version }} &
          ./build/examples/csp_server -z localhost -a 1 -t -v ${{ matrix.csp_version }}
          pkill zmqproxy

      - name: Setup vcan0
        run: |
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
          echo "Waiting for vcan0 to be up..."
          while ! ip -br link show vcan0 | grep -q "UP"; do
            sleep 0.1
          done
          echo "vcan0 is up"

      - name: Run CAN Server Test
        run: |
          ./build/examples/csp_server -c vcan0 -a 1 -T 10 -v ${{ matrix.csp_version }} &
          ./build/examples/csp_client -c vcan0 -a 2 -C 1 -t -v ${{ matrix.csp_version }}

      - name: Run CAN Client Test
        run: |
          ./build/examples/csp_client -c vcan0 -a 2 -C 1 -T 10 -v ${{ matrix.csp_version }} &
          ./build/examples/csp_server -c vcan0 -a 1 -t -v ${{ matrix.csp_version }}

      - name: Run UDP Server Test
        run: |
          ./build/examples/csp_server -u "127.0.0.1" -a 1 -T 10 -v ${{ matrix.csp_version }} &
          ./build/examples/csp_client -u "127.0.0.1" -a 2 -C 1 -T 10 -v ${{ matrix.csp_version }}
          wait "$!"

      - name: Run UDP Client Test
        run: |
          ./build/examples/csp_client -u "127.0.0.1" -a 2 -C 1 -T 10 -v ${{ matrix.csp_version }} &
          ./build/examples/csp_server -u "127.0.0.1" -a 1 -T 10 -v ${{ matrix.csp_version }}

      - name: Setup veth0 and veth1
        run: |
          sudo ip link add veth0 type veth peer name veth1
          sudo ip link set veth0 up
          echo "veth0 is up"
          sudo ip link set veth1 up
          echo "veth1 is up"

      - name: Check shared library dependencies with ldd
        run: |
          echo "🔍 ldd for csp_server:"
          ldd ./build/examples/csp_server || echo "❌ csp_server not found or failed"

          echo ""
          echo "🔍 ldd for csp_client:"
          ldd ./build/examples/csp_client || echo "❌ csp_client not found or failed"

      - name: Print environment variables before setcap
        run: |
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          echo "PATH=$PATH"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          echo "LD_RUN_PATH=$LD_RUN_PATH"
          echo "LD_PRELOAD=$LD_PRELOAD"
          echo "RPATH (from binary):"
          find . -type f -executable -exec echo {} \; -exec readelf -d {} \; | grep -i 'rpath\|runpath' || true

      - name: Patch RPATH to absolute path
        run: |
          echo "Current RPATH:"
          patchelf --print-rpath ./build/examples/csp_server || echo "No RPATH set"
          patchelf --print-rpath ./build/examples/csp_client || echo "No RPATH set"

          ABS_PATH="$(pwd)/build"
          echo "Setting RPATH to: $ABS_PATH"

          patchelf --set-rpath "$ABS_PATH" ./build/examples/csp_server
          patchelf --set-rpath "$ABS_PATH" ./build/examples/csp_client

          echo "New RPATH:"
          patchelf --print-rpath ./build/examples/csp_server
          patchelf --print-rpath ./build/examples/csp_client

      - name: Setcap cap_net_raw+ep for csp_client and csp_server
        run: |
          sudo --preserve-env setcap cap_net_raw+ep ./build/examples/csp_server
          sudo --preserve-env setcap cap_net_raw+ep ./build/examples/csp_client

      - name: Print environment variables
        run: |
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          echo "PATH=$PATH"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          echo "LD_RUN_PATH=$LD_RUN_PATH"
          echo "LD_PRELOAD=$LD_PRELOAD"
          echo "RPATH (from binary):"
          find . -type f -executable -exec echo {} \; -exec readelf -d {} \; | grep -i 'rpath\|runpath' || true

      - name: Check shared library dependencies with ldd after setcap
        run: |
          echo "🔍 ldd for csp_server:"
          ldd ./build/examples/csp_server || echo "❌ csp_server not found or failed"

          echo ""
          echo "🔍 ldd for csp_client:"
          ldd ./build/examples/csp_client || echo "❌ csp_client not found or failed"
      - name: Run ETH Server Test
        run: |
          ./build/examples/csp_server -e veth1 -a 1 -T 10 -v ${{ matrix.csp_version }} &
          ./build/examples/csp_client -e veth0 -a 2 -C 1 -t -v ${{ matrix.csp_version }}

      - name: Run ETH Client Test
        run: |
          ./build/examples/csp_client -e veth0 -a 2 -C 1 -T 10 -v ${{ matrix.csp_version }} &
          ./build/examples/csp_server -e veth1 -a 1 -t -v ${{ matrix.csp_version }}
