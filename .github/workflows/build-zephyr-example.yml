name: Zephyr Build Example

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
        sdk-version:
          - '0.16.8'
          - '0.17.4'

    steps:
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Python version
        run: python3 --version

      - name: Checkout libcsp
        uses: actions/checkout@v5
        with:
          path: libcsp

      - name: Setup Zephyr
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: libcsp
          toolchains: zephyr-native
          sdk-version: ${{ matrix.sdk-version }}

      - name: Build Zephyr sample (server-client)
        working-directory: libcsp/contrib/zephyr/
        run: |
          west build -b qemu_x86 samples/server-client
