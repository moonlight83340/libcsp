# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - libclang-dev
    - cmake
    - ninja-build
  jobs:
    post_install:
      - cmake -S doc -B $READTHEDOCS_OUTPUT -G Ninja
      - cmake --build $READTHEDOCS_OUTPUT

python:
  install:
    - requirements: doc/requirements.txt

sphinx:
  configuration: doc/conf.py